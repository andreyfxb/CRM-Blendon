<div class="grid g2"><div class="cd"><b>Evolução das vendas (R$ mil)</b>${line(monthly(S.clients,'closed'),monthLabels())}</div><div class="cd"><b>Origem dos clientes</b>${bars(cnt(c,x=>x.origin))}<hr style="border:0;border-top:1px solid var(--bd)"><b>Conversão</b>${bars({'Contato → venda':cv,'Negociação ganha':wr},v=>v+'%')}</div></div>
<div class="grid g2"><div class="cd"><b>Próximos follow-ups</b>${p.slice(0,5).map(x=>row(x,`<span class="pill ${x.follow<TD?'r':''}">${x.follow<TD?'Vencido':x.follow==TD?'Hoje':fd(x.follow)}</span>`)).join('')||'<p class="mu">Nada pendente</p>'}</div><div class="cd"><b>Negociações recentes</b>${[...c].sort((a,b)=>a.last<b.last?1:-1).slice(0,5).map(x=>row(x,`<b>${R(x.value)}</b><div class="mu">${ST[x.stage]}</div>`)).join('')}</div></div>`};
function tbl(st){const q=(S.q||'').toLowerCase(),qd=q.replace(/\D/g,''),L=S.clients.filter(c=>(!st||c.stage==st)&&(!S.org||c.origin==S.org)&&(!q||c.name.toLowerCase().includes(q)||c.phone.includes(q)||(qd&&c.phone.replace(/\D/g,'').includes(qd))));

V.negociando=()=>hd('Pipeline de negociações','Arraste os cartões ou abra um cartão para mover de etapa')+`<div class="kb">${Object.keys(ST).map(s=>{const L=S.clients.filter(c=>c.stage==s);return`<div class="col" ondragover="event.preventDefault()" ondrop="moveTo(event.dataTransfer.getData('t'),'${s}')"><h4>${ST[s]}<span class="pill">${L.length}</span></h4>${L.map(c=>`<div class="kc" draggable="true" ondragstart="event.dataTransfer.setData('t',${c.id})" onclick="det(${c.id})"><b>${E(c.name)}</b><div>${E(c.product)} ${E(c.model)}</div><div><b>${R(c.value)}</b> · ${c.origin}</div><div class="mu">Última interação: ${fd(c.last)}</div><div class="mu"><i data-lucide="arrow-right"></i> ${E(c.next)}</div></div>`).join('')}</div>`}).join('')}</div>`;
V.followup=()=>{const p=pend(),g=(t,L,cls)=>`<div class="cd" style="margin-bottom:14px"><b>${t}</b> <span class="pill ${cls}">${L.length}</span>${L.map(c=>`<div class="li" style="cursor:default"><div class="av">${ini(c.name)}</div><div><b>${E(c.name)}</b><div class="mu">${E(c.product)} ${E(c.model)} · ${fd(c.follow)} · ${ST[c.stage]}</div></div><span class="sp"></span><div class="ra"><button class="btn sm p" onclick="fuMsg(${c.id})"><i data-lucide="sparkles"></i>Gerar mensagem</button><button class="btn sm" onclick="fuReply(${c.id})">Respondeu</button><button class="btn sm" onclick="fuDate(${c.id})">Reagendar</button><button class="btn sm" onclick="fuDone(${c.id})">Realizado</button></div></div>`).join('')||'<p class="mu">Nenhum</p>'}</div>`;

function fuMsg(id){const c=cli(id);modal(`<h3>Mensagem sugerida · ${E(c.name)}</h3><textarea id="mt" rows="5" style="width:100%">${E(msg(c))}</textarea><p class="mu">Envio automático via API oficial do WhatsApp Business: integração futura.</p><div class="ra"><button class="btn" onclick="copy()"><i data-lucide="copy"></i>Copiar mensagem</button><button class="btn" onclick="openWA(${id},$('mt').value)"><i data-lucide="message-circle"></i>Abrir no WhatsApp</button><button class="btn" onclick="fuDate(${id})">Reagendar</button><button class="btn p" onclick="fuDone(${id})">Marcar como realizado</button></div>`)}

if(st=='perdidos'&&!x)return modal(`<h3>Motivo da perda</h3><select id="mo">${MOT.map(m=>`<option>${m}</option>`).join('')}</select><div class="ra"><button class="btn" onclick="cl()">Cancelar</button><button class="btn p" onclick="moveTo(${id},'perdidos',{m:$('mo').value})">Confirmar</button></div>`);
c.stage=st;hist(c,'Movido para '+ST[st]);if(st=='vendidos'){c.closed=x.v;c.endDate=TD;c.follow=null;c.next='Pós-venda'}else if(st=='perdidos'){c.reason=x.m;c.endDate=TD;c.follow=null;c.next='—'}else{c.follow=D(S.cfg.dias);toast('Lembrete reprogramado para '+fd(c.follow))}cl();render()}
function det(id){const c=cli(id);modal(`<h3>${E(c.name)} ${pill(c.stage)}</h3><div class="fg mu"><div>Telefone: ${E(c.phone)}</div><div>Instagram: ${E(c.ig)}</div><div>Origem: ${c.origin}</div><div>Cadastro: ${fd(c.created)}</div><div>Produto: ${E(c.product)} ${E(c.model)}</div><div>${E(c.storage)} · ${E(c.color)}</div><div>Orçamento: ${R(c.budget)}</div><div>Estimado: ${R(c.value)}</div><div class="w">Próxima ação: ${E(c.next)} · Follow-up: ${fd(c.follow)}</div><div class="w">Obs.: ${E(c.notes)||'—'}</div></div><b>Histórico</b>${[...c.hist].reverse().map(h=>`<div class="mu">${fd(h.d)} · ${E(h.t)}</div>`).join('')}<div class="ra" style="margin-top:12px"><select onchange="moveTo(${id},this.value)"><option>Mover para…</option>${Object.keys(ST).filter(s=>s!=c.stage).map(s=>`<option value="${s}">${ST[s]}</option>`).join('')}</select><button class="btn" onclick="frm(${id})">Editar</button><button class="btn" onclick="fuMsg(${id})">Mensagem</button><button class="btn d" onclick="del(${id})">Excluir</button></div>`)}
function frm(id){const c=cli(id)||{origin:'WhatsApp',created:TD},f=(n,l,t='text',w)=>`<label class="${w?'w':''}">${l}<input name="${n}" type="${t}" value="${E(c[n])}"></label>`;

return hd('WhatsApp','Interface demonstrativa')+'<div class="note"><b>Integração oficial pendente:</b> o envio real depende da API do WhatsApp Business, de credenciais (token, ID do número) e aprovação da Meta. Nada aqui é enviado de verdade.</div><div class="wa"><div class="cd">'+S.clients.map(x=>`<div class="li" onclick="S.wa=${x.id};render()" style="${x.id==c.id?'font-weight:700':''}"><div class="av">${ini(x.name)}</div>${E(x.name)}</div>`).join('')+`</div><div class="cd"><div class="li" style="cursor:default"><b>${E(c.name)}</b><span class="mu">${E(c.wa)}</span><span class="sp"></span><button class="btn sm" onclick="openWA(${c.id})">Abrir WhatsApp</button></div><div class="chat">${ch.map(m=>`<div class="bb ${m.me?'me':''}">${E(m.m)}</div>`).join('')}</div><div class="tb"><input id="cm" style="flex:1" placeholder="Digite uma mensagem demonstrativa"><button class="btn p" onclick="snd(${c.id})">Enviar (demo)</button></div></div></div>`};

V.config=()=>{const g=S.cfg,i=(k,l,t='text')=>`<label>${l}<input id="c_${k}" type="${t}" value="${E(g[k])}"></label>`,ck=(k,l)=>`<label><input type="checkbox" id="c_${k}" ${g[k]?'checked':''}> ${l}</label>`;

function svc(){const g=S.cfg;['loja','admin','tok','telefone'].forEach(k=>g[k]=$('c_'+k).value);g.dias=Math.max(1,+$('c_dias').value||2);['n1','n2','n3'].forEach(k=>g[k]=$('c_'+k).checked);toast('Configurações salvas');save()}
function bell(){const p=pend(),a=p.filter(x=>x.follow<TD).length,b=p.filter(x=>x.follow==TD).length;toast(`${a} follow-up(s) vencido(s) · ${b} para hoje`)}
function render(){const v=S.view;$('nav').innerHTML=NAV.map(([k,l,i])=>`<button class="nv ${k==v?'on':''}" onclick="go('${k}')"><i data-lucide="${i}"></i>${l}</button>`).join('');$('pg').innerHTML=(V[v]||V.dashboard)();ic();save()}

// Chave estável: mantenha-a nas próximas versões para preservar os cadastros.
function months(){return Array.from({length:6},(_,i)=>new Date(T.getFullYear(),T.getMonth()-5+i,1))}
function monthLabels(){return months().map(d=>d.toLocaleDateString('pt-BR',{month:'short'}))}
function monthly(list,field){return months().map(d=>list.filter(c=>c.stage==='vendidos'&&c.endDate&&c.endDate.slice(0,7)===`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`).reduce((n,c)=>n+(+c[field]||0),0)/1000)}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='AXION-backup-'+TD+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function restoreBackup(file){if(!file)return;try{const d=JSON.parse(await file.text());if(!d.cfg||!Array.isArray(d.clients)||!d.clients.every(c=>c&&typeof c.name==='string'&&Array.isArray(c.hist)&&Array.isArray(c.chat)&&ST[c.stage]))throw Error();if(!confirm('Substituir os dados atuais por este backup?'))return;S={...S,...d,view:'dashboard',q:'',org:''};save();render();toast('Backup restaurado')}catch(e){toast('Backup inválido. Nenhuma alteração realizada.')}}

render();
</script><script>
const CN={WhatsApp:'#1d6bff',Instagram:'#0a0b0e','Indicação':'#a9b0be',Outros:'#8db6ff'},AVC=['#0a0b0e','#1d6bff','#3b4252','#2f7bff','#5b6577','#14316b'],KC={novos:'#8b93a3',negociando:'#1d6bff',followup:'#e0992a',aguardando:'#6c4be0',vendidos:'#1f9d57',perdidos:'#e5484d'},SL={novos:'Novo contato',negociando:'Negociando',followup:'Follow-up',aguardando:'Aguardando',vendidos:'Vendido',perdidos:'Perdido'},SC={novos:'s-novo',negociando:'s-neg',followup:'s-fu',aguardando:'s-ag',vendidos:'s-ven',perdidos:'s-per'};
const av2=(n,s=34)=>`<div class="a2" style="width:${s}px;height:${s}px;background:${AVC[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%6]};font-size:${s*.36|0}px">${ini(n)}</div>`,pl2=s=>`<span class="pill ${SC[s]}">${SL[s]}</span>`,fup=x=>`<span class="pill ${x.follow<TD?'s-per':x.follow==TD?'s-fu':'s-novo'}">${x.follow<TD?'Atrasado':x.follow==TD?'Hoje':fd(x.follow)}</span>`,og2=c=>`<span class="pill s-novo"><i class="dt" style="background:${CN[c.origin]}"></i>${c.origin}</span>`;
const K=(l,v,s,i,t,r)=>`<div class="kp"><div class="ki ${t}"><i data-lucide="${i}"></i></div><div><div class="kl">${l}</div><div class="kv">${v}</div></div><div class="ks ${r||''}">${s}</div></div>`;
const grid=(y,m,h,l,tip)=>[0,1,2,3,4].map(k=>`<line x1="44" x2="702" y1="${y+(h-y-28)*k/4}" y2="${y+(h-y-28)*k/4}" stroke="#8884" stroke-opacity=".3"/><text x="34" y="${y+4+(h-y-28)*k/4}" text-anchor="end" font-size="11" fill="#9aa2b1">${Math.round(m*(1-k/4))}k</text>`).join('');
function area(v,l){const w=720,h=190,m=Math.max(...v,1)*1.18,p=v.map((y,i)=>[44+i*(w-62)/(v.length-1),26+(h-54)*(1-y/m)]),s=p.map(a=>a.join(',')).join(' '),[lx,ly]=p.at(-1);return`<svg viewBox="0 0 ${w} ${h}" width="100%"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d6bff" stop-opacity=".22"/><stop offset="1" stop-color="#1d6bff" stop-opacity="0"/></linearGradient></defs>${grid(26,m,h)}<polygon points="44,${h-28} ${s} ${lx},${h-28}" fill="url(#ag)"/><polyline points="${s}" fill="none" stroke="#1d6bff" stroke-width="3.2" stroke-linejoin="round"/>${p.map((a,i)=>`<circle cx="${a[0]}" cy="${a[1]}" r="5" fill="#fff" stroke="#1d6bff" stroke-width="2.6"/><text x="${a[0]}" y="${h-8}" text-anchor="middle" font-size="12" fill="#9aa2b1">${l[i]}</text>`).join('')}<rect x="${lx-98}" y="${ly-14}" width="86" height="24" rx="7" fill="#0a0b0e"/><text x="${lx-55}" y="${ly+2}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">${R(v.at(-1)*1000)}</text></svg>`}
function gb(a,b,l){const w=720,h=230,m=Math.max(...a,...b,1)*1.15,bw=(w-54)/a.length;return`<svg viewBox="0 0 ${w} ${h}" width="100%">${grid(12,m,h)}${a.map((x,i)=>{const cx=44+i*bw+bw/2,f=(v,d,c)=>{const q=(h-40)*v/m;return`<rect x="${cx+d}" y="${h-28-q}" width="15" height="${q}" rx="4" fill="${c}"/>`};return f(x,-17,'#c9d9ff')+f(b[i],3,'#1d6bff')+`<text x="${cx}" y="${h-8}" text-anchor="middle" font-size="12" fill="#9aa2b1">${l[i]}</text>`}).join('')}</svg>`}
function donut(o,t){let a=0;const e=ORI.map(k=>[k,Math.round((o[k]||0)/Math.max(t,1)*100)]),st=e.map(([k,p])=>{const r=`${CN[k]} ${a}% ${a+p}%`;a+=p;return r}).join(',');return`<div class="dn"><div class="dc" style="background:conic-gradient(${st})"><div><b>${t}</b><span class="mu">clientes</span></div></div><div>${e.map(([k,p])=>`<div class="lg2"><i style="background:${CN[k]}"></i>${k}<b>${p}%</b></div>`).join('')}</div></div>`}
function render(){const v=S.view,c=S.clients,n=s=>c.filter(x=>x.stage==s).length,ct={clientes:c.length,novos:n('novos'),negociando:n('negociando'),followup:pend().length,aguardando:n('aguardando'),vendidos:n('vendidos'),perdidos:n('perdidos')};$('nav').innerHTML='<div class="nvl">MENU</div>'+NAV.map(([k,l,i])=>`<button class="nv ${k==v?'on':''}" onclick="go('${k}')"><i data-lucide="${i}"></i>${l}${ct[k]!=null?`<span class="c ${k=='followup'&&k!=v?'h':''}">${ct[k]}</span>`:''}</button>`).join('');$('pg').innerHTML=(V[v]||V.dashboard)();ic();save()}
V.dashboard=()=>{const c=S.clients,n=s=>c.filter(x=>x.stage==s).length,so=c.filter(x=>x.stage=='vendidos'),A=c.filter(act),fe=so.reduce((a,x)=>a+x.closed,0),es=A.reduce((a,x)=>a+x.value,0),p=pend(),late=p.filter(x=>x.follow<TD).length,cv=c.length?(so.length/c.length*100).toFixed(1).replace('.',','):0,ac=c.flatMap(x=>x.hist.map(h=>({c:x,h}))).sort((a,b)=>a.h.d<b.h.d?1:-1).slice(0,4);
return hd('Dashboard','Visão geral comercial','<button class="btn" onclick="render();toast(\'Indicadores atualizados\')"><i data-lucide="refresh-cw"></i>Atualizar</button>')+`<div class="g4">${K('Total de clientes',c.length,'na base','users','b')}${K('Novos contatos',n('novos'),'sem 1º contato','user-plus','b')}${K('Em negociação',n('negociando')+n('followup')+n('aguardando'),n('aguardando')+' aguardando','kanban','n','m')}${K('Follow-ups pendentes',p.filter(x=>x.follow<=TD).length,late+' atrasados','bell','k','r')}${K('Vendas realizadas',so.length,'','badge-check','b')}${K('Faturamento',R(fe),'','wallet','k')}${K('Valor em negociação',R(es),'em aberto','trending-up','n','m')}${K('Taxa de conversão',cv+'%','','percent','b')}</div><div class="g23"><div class="cd"><div class="ct">Evolução das vendas</div><div class="cs">Faturamento mensal fechado · últimos 6 meses</div>${area(monthly(S.clients,'closed'),monthLabels())}</div><div class="cd"><div class="ct">Origem dos contatos</div><div class="cs">Distribuição dos ${c.length} clientes</div>${donut(cnt(c,x=>x.origin),c.length)}</div></div><div class="grid g2"><div class="cd"><div class="ct">Follow-ups próximos</div>${p.slice(0,4).map(x=>`<div class="li" onclick="det(${x.id})">${av2(x.name)}<div><b>${E(x.name)}</b><div class="mu">${E(x.product)} ${E(x.model)}</div></div><span class="sp"></span>${fup(x)}</div>`).join('')||'<p class="mu">Nada pendente</p>'}</div><div class="cd"><div class="ct">Atividades recentes</div>${ac.map(a=>`<div class="li" onclick="det(${a.c.id})"><div class="ki b sm"><i data-lucide="activity"></i></div><div><b>${E(a.h.t)}</b><div class="mu">${E(a.c.name)} · ${E(a.c.product)} ${E(a.c.model)}</div></div><span class="sp"></span><span class="mu">${fd(a.h.d)}</span></div>`).join('')}</div></div>`};
function tbl(st){const q=(S.q||'').toLowerCase(),qd=q.replace(/\D/g,''),L=S.clients.filter(c=>(!st||c.stage==st)&&(!S.org||c.origin==S.org)&&(!q||c.name.toLowerCase().includes(q)||c.phone.includes(q)||(qd&&c.phone.replace(/\D/g,'').includes(qd))));return`<div class="tw"><div class="tr th"><div>CLIENTE</div><div>TELEFONE</div><div>ORIGEM</div><div>PRODUTO DE INTERESSE</div><div>STATUS</div><div>VALOR ESTIMADO</div><div></div></div>${L.map(c=>`<div class="tr" onclick="det(${c.id})"><div class="cl">${av2(c.name)}<div><b>${E(c.name)}</b><div class="mu">Cadastro em ${c.created.split('-').reverse().join('/')}</div></div></div><div>${E(c.phone)}</div><div>${og2(c)}</div><div>${E(c.product)} ${E(c.model)}</div><div>${pl2(c.stage)}</div><div><b>${R(c.value)}</b></div><div onclick="event.stopPropagation()"><button class="btn sm" onclick="frm(${c.id})"><i data-lucide="pencil"></i></button> <button class="btn sm d" onclick="del(${c.id})"><i data-lucide="trash-2"></i></button></div></div>`).join('')||'<div class="tr"><div class="mu">Nenhum cliente encontrado</div></div>'}<div class="pgn mu">Mostrando ${L.length?'1–'+L.length:0} de ${L.length} clientes</div></div>`}
const tools2=st=>`<div class="tb"><input style="min-width:280px" placeholder="Buscar por nome ou telefone" value="${E(S.q)}" oninput="S.q=this.value;$('tbl').innerHTML=tbl('${st}');ic()"><select onchange="S.org=this.value;$('tbl').innerHTML=tbl('${st}');ic()"><option value="">Origem: Todas</option>${ORI.map(o=>`<option ${S.org==o?'selected':''}>${o}</option>`).join('')}</select></div><div class="cd p0" id="tbl">${tbl(st)}</div>`;
V.clientes=()=>hd('Clientes',`${S.clients.length} clientes cadastrados`,'<button class="btn p" onclick="frm()"><i data-lucide="plus"></i>Novo cliente</button>')+tools2('');V.novos=()=>hd('Novos contatos','Clientes aguardando primeiro atendimento')+tools2('novos');V.aguardando=()=>hd('Aguardando resposta','Clientes que ficaram de retornar')+tools2('aguardando');
V.negociando=()=>hd('Pipeline de negociações',`Arraste os cartões entre as etapas · ${S.clients.filter(act).length} negociações ativas`)+`<div class="kb">${Object.keys(ST).map(s=>{const L=S.clients.filter(c=>c.stage==s);return`<div class="col" ondragover="event.preventDefault()" ondrop="moveTo(event.dataTransfer.getData('t'),'${s}')"><div class="ch" style="border-color:${KC[s]}"><h4>${ST[s]}<span class="cn">${L.length}</span></h4><div class="mu">${R(L.reduce((a,x)=>a+x.value,0))}</div></div>${L.map(c=>`<div class="kc" draggable="true" ondragstart="event.dataTransfer.setData('t',${c.id})" onclick="det(${c.id})"><div class="cl">${av2(c.name,26)}<b>${E(c.name)}</b></div><div class="pr">${E(c.product)} ${E(c.model)}</div><div class="vr"><b>${R(c.value)}</b><span class="mu"><i class="dt" style="background:${CN[c.origin]}"></i>${c.origin}</span></div><div class="ft mu">Últ. interação: ${fd(c.last)}<span><i data-lucide="arrow-right"></i>${E(c.next)}</span></div></div>`).join('')}</div>`}).join('')}</div>`;
V.followup=()=>{const p=pend(),sel=p.find(x=>x.id==S.fsel)||p[0],a=p.filter(x=>x.follow<TD),h=p.filter(x=>x.follow==TD),b=p.filter(x=>x.follow>TD),g=(t,L,col,pc)=>`<div class="cd p0"><div class="gh"><i class="dt" style="background:${col}"></i><b>${t}</b><span class="pill ${pc}">${L.length}</span></div>${L.map(c=>`<div class="fr"><div class="cl">${av2(c.name,32)}<div><b>${E(c.name)}</b><div class="mu">${E(c.product)} ${E(c.model)}</div></div></div><div class="mu">Último contato<br><b class="tx">${fd(c.last)}</b></div><div class="mu">Próximo contato<br><b class="tx">${fd(c.follow)}</b> ${fup(c)}</div><div class="ra"><button class="btn sm p" onclick="S.fsel=${c.id};render()"><i data-lucide="sparkles"></i>Gerar mensagem</button><button class="btn sm" onclick="openWA(${c.id})"><i data-lucide="external-link"></i>Abrir WhatsApp</button></div></div>`).join('')||'<p class="mu" style="padding:12px 16px">Nenhum</p>'}</div>`;
return hd('Follow-up Inteligente',`Sem avanço? Novo acompanhamento em ${S.cfg.dias} dias · ${p.length} pendentes`)+`<div class="g4">${K('Atrasados',a.length,'','clock','k')}${K('Para hoje',h.length,'','bell','n')}${K('Próximos',b.length,'','calendar','b')}${K('Realizados',S.fu,'','badge-check','b')}</div><div class="fl"><div class="fm">${g('Atrasados',a,'#e5484d','s-per')}${g('Para hoje',h,'#e0992a','s-fu')}${g('Próximos acompanhamentos',b,'#1d6bff','s-neg')}</div>${sel?`<div class="cd fp"><div class="ct">Mensagem sugerida</div><div class="cs">${E(sel.name)} · ${E(sel.product)} ${E(sel.model)}</div><textarea id="mt" rows="6">${E(msg(sel))}</textarea><div class="ra"><button class="btn sm" onclick="copy()"><i data-lucide="copy"></i>Copiar mensagem</button><button class="btn sm p" onclick="openWA(${sel.id},$('mt').value)"><i data-lucide="external-link"></i>Abrir WhatsApp</button><button class="btn sm" onclick="fuDone(${sel.id})">Marcar como realizado</button><button class="btn sm" onclick="fuDate(${sel.id})">Reagendar</button><button class="btn sm" onclick="fuReply(${sel.id})">Cliente respondeu</button></div><div class="note" style="margin:14px 0 0"><b>Envio automático: em planejamento.</b> Previsto via API oficial do WhatsApp Business, que depende de configuração e credenciais. Aqui a mensagem é apenas sugerida.</div></div>`:''}</div>`};
const dch=c=>[];
V.whatsapp=()=>{const c=cli(S.wa)||S.clients[0];if(!c)return hd('WhatsApp','Cadastre um cliente para iniciar')+'<div class="cd"><p>Nenhum cliente cadastrado.</p><button class="btn p" onclick="frm()">Novo cliente</button></div>';const ch=c.chat.length?c.chat:dch(c);return hd('WhatsApp','Central de atendimento · interface demonstrativa')+`<div class="w3"><div class="cd p0">${S.clients.map(x=>`<div class="li ${x.id==c.id?'on':''}" style="padding:12px 14px" onclick="S.wa=${x.id};render()">${av2(x.name,40)}<div><b>${E(x.name)}</b><div class="mu">${E((x.chat.at(-1)||{m:'Sem mensagens'}).m.slice(0,30))}…</div></div></div>`).join('')}</div><div class="cd p0 chw"><div class="chh">${av2(c.name,40)}<div><b>${E(c.name)}</b><div class="mu">${E(c.wa)} · ${E(c.product)} ${E(c.model)}</div></div><span class="sp"></span>${pl2(c.stage)}<button class="btn sm" onclick="openWA(${c.id})"><i data-lucide="external-link"></i>Abrir WhatsApp</button></div><div class="chat">${ch.map(m=>`<div class="bb ${m.me?'me':''}">${E(m.m)}</div>`).join('')}</div><div class="chi"><input id="cm" placeholder="Digite uma mensagem demonstrativa" onkeydown="if(event.key=='Enter')snd(${c.id})"><button class="btn p" onclick="snd(${c.id})"><i data-lucide="send"></i></button></div></div><div class="cd inf"><div style="text-align:center">${av2(c.name,64)}<b style="display:block;margin-top:8px">${E(c.name)}</b><span class="mu">${E(c.ig)} · desde ${fd(c.created)}</span></div><div style="margin:14px 0">${[['Produto',c.product+' '+c.model],['Armazenamento',c.storage],['Cor',c.color],['Valor estimado',R(c.value)],['Origem',c.origin],['Próx. follow-up',fd(c.follow)]].map(([a,b])=>`<div class="rw"><span class="mu">${a}</span><b>${E(b)}</b></div>`).join('')}</div><div class="ra"><button class="btn p sm" onclick="det(${c.id})">Mover etapa</button><button class="btn sm" onclick="fuDate(${c.id})">Reagendar follow-up</button></div><div class="note" style="margin:14px 0 0"><b>WhatsApp Business</b><br>Tela ilustrativa. A integração oficial depende de configuração e credenciais externas.</div></div></div>`};
V.relatorios=()=>{const lim=S.per=='all'?'0000':D(-S.per),c=S.clients.filter(x=>x.created>=lim),so=c.filter(x=>x.stage=='vendidos'),lo=c.filter(x=>x.stage=='perdidos'),es=so.reduce((a,x)=>a+x.value,0),fe=so.reduce((a,x)=>a+x.closed,0),fu=[['Contatos',c.length],['Em negociação',c.filter(x=>x.stage!='novos').length],['Propostas',c.filter(x=>['followup','aguardando','vendidos'].includes(x.stage)).length],['Vendas',so.length]];
return hd('Relatórios','Indicadores comerciais por período',[['7','7 dias'],['30','30 dias'],['90','90 dias'],['all','Tudo']].map(([v,l])=>`<button class="btn ${S.per==v?'p':''}" onclick="S.per='${v}';render()">${l}</button>`).join(' '))+`<div class="g4">${K('Contatos no período',c.length,'','users','b')}${K('Conversão em vendas',(c.length?(so.length/c.length*100).toFixed(1).replace('.',','):0)+'%','','percent','b')}${K('Faturamento',R(fe),'','wallet','k')}${K('Negociações perdidas',lo.length,'','x-circle','n')}</div><div class="g23"><div class="cd"><div class="ct">Vendas por período</div><div class="cs">Estimado (claro) × fechado (azul), R$ mil</div>${gb(monthly(c,'value'),monthly(c,'closed'),monthLabels())}</div><div class="cd"><div class="ct">Conversão de clientes</div><div class="cs">Funil comercial do período</div>${fu.map(([l,v],i)=>`<div style="display:flex;justify-content:center;margin:14px 0"><div style="width:${Math.max(v/Math.max(fu[0][1],1)*100,45)}%;height:38px;border-radius:9px;background:${['#0a0b0e','#14316b','#1d6bff','#5b9bff'][i]};color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-weight:600;font-size:12.5px"><span>${l}</span><b>${v}</b></div></div>`).join('')}</div></div><div class="grid g2" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="cd"><div class="ct">Origem dos contatos</div>${donut(cnt(c,x=>x.origin),c.length)}</div><div class="cd"><div class="ct">Negociações perdidas</div><div class="cs">Motivo da perda</div>${bars(cnt(lo,x=>x.reason))}</div><div class="cd"><div class="ct">Produtos mais procurados</div><div class="cs">Interesses registrados</div>${bars(cnt(c,x=>x.product))}</div></div>`};

// Chave estável: mantenha-a nas próximas versões para preservar os cadastros.
function months(){return Array.from({length:6},(_,i)=>new Date(T.getFullYear(),T.getMonth()-5+i,1))}
function monthLabels(){return months().map(d=>d.toLocaleDateString('pt-BR',{month:'short'}))}
function monthly(list,field){return months().map(d=>list.filter(c=>c.stage==='vendidos'&&c.endDate&&c.endDate.slice(0,7)===`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`).reduce((n,c)=>n+(+c[field]||0),0)/1000)}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='AXION-backup-'+TD+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function restoreBackup(file){if(!file)return;try{const d=JSON.parse(await file.text());if(!d.cfg||!Array.isArray(d.clients)||!d.clients.every(c=>c&&typeof c.name==='string'&&Array.isArray(c.hist)&&Array.isArray(c.chat)&&ST[c.stage]))throw Error();if(!confirm('Substituir os dados atuais por este backup?'))return;S={...S,...d,view:'dashboard',q:'',org:''};save();render();toast('Backup restaurado')}catch(e){toast('Backup inválido. Nenhuma alteração realizada.')}}

render();
</script></body></html>
